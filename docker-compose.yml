# ─────────────────────────────────────────────────────────────
# GenAI Data Assistant – local stack
#
#   db   →  Postgres 16 with the pgvector extension
#   api  →  FastAPI service (uvicorn on :8000)
#   ui   →  Streamlit front-end (on :8501)
#
# Note: Ollama is expected to run on the HOST machine
# (http://host.docker.internal:11434) so the LLM keeps its
# native GPU acceleration.
# ─────────────────────────────────────────────────────────────

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: genai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-genai_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-genai_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: genai-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-genai_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      DEFAULT_TOKENS: ${DEFAULT_TOKENS:-100}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/uploads:/app/data/uploads
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  ui:
    build: .
    container_name: genai-ui
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    command: streamlit run ui/app.py --server.address=0.0.0.0 --server.port=8501

volumes:
  pgdata:
